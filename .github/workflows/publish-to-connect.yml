name: Deploy to Posit Connect

on:
  push:
    branches: [ main ]  # Adjust to your default branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Network Debug
        run: |
          # Strip protocol and path for clean testing
          TARGET=$(echo "${{ secrets.CONNECT_SERVER }}" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          echo "Testing: $TARGET"
          
          nslookup $TARGET || echo "DNS failed"
          ping -c 3 $TARGET || echo "Ping failed"

      - name: Publish to Connect
        uses: rstudio/actions/connect-publish@main
        with:
          url: ${{ secrets.CONNECT_SERVER }}
          api-key: ${{ secrets.CONNECT_API_KEY }}
          dir: ./
          name: runas-app-gha
